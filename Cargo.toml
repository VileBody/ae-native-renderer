[workspace]
resolver = "2"
members = [
  "crates/render-cli",
  "crates/render-ir",
  "crates/render-core",
  "crates/raster-cpu",
  "crates/transform-math",
  "crates/media-gst",
  "crates/text-engine",
  "crates/expression-engine",
  "crates/effects",
  "crates/ae-bridge",
  "crates/testkit"
]

[workspace.package]
edition = "2021"
license = "Proprietary"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
image = { version = "0.25", default-features = false, features = ["png"] }
fontdue = "0.9"
ttf-parser = "0.21.1"
rustybuzz = "0.20.1"
