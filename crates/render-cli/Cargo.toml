[package]
name = "render-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "render-cli"

[[bin]]
name = "render-cli"
path = "src/main.rs"
required-features = ["media"]

[[bin]]
name = "p2-text-journal"
path = "src/bin/p2_text_journal.rs"

[features]
default = ["media"]
media = ["dep:media-gst"]

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
render-ir = { path = "../render-ir" }
render-core = { path = "../render-core" }
media-gst = { path = "../media-gst", optional = true }
effects = { path = "../effects" }
ae-bridge = { path = "../ae-bridge" }
raster-cpu = { path = "../raster-cpu" }
testkit = { path = "../testkit" }
